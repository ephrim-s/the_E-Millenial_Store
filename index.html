<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/styles.css">
    <script src="scripts/scripts.js"></script>
    <title>The E-Millenial Store</title>
</head>
<body>
    <header>
        <div class="logo"><img src="images/EMS.svg" alt="EMS logo"></div>
        <nav class="topnav">
            <ul class="navlist">
                <li><a href="">Intro</a></li>
                <li><a href="">About</a></li>
                <li><a href="">Shop</a></li>
            </ul>
        </nav>
        <div class="cart-container">
            <div><img src="images/cart.svg" alt="cart img" id="cartImg"></div>
            <span id="cart-count">0</span>
        </div>

    </header>
    <main>
        <section id="hero">
            <div class="content">
                <div id="shopName">THE E-MILLENIAL STORE</div>
                <img src="images/heroImage.png" alt="hero image" style="width: 40%;">
            </div>
            <button id="hero-button">SHOP NOW</button>
        </section>
        <section id="aboutSection">

        </section>
        <section id="shopSection">

        </section>

    </main>
    <footer>

    </footer>
    
</body>
</html>
